name: Windows ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-zip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: ocr
          python-version: '3.11'
          auto-activate-base: false
          channels: conda-forge
          channel-priority: strict
      - name: Install pinned OCR runtime
        shell: pwsh
        run: |
          conda install --name ocr --override-channels --channel conda-forge --yes tesseract=5.3.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          conda info --json | Out-File -Encoding utf8 conda-info.json
          $prefix = (conda run --name ocr python -c "import sys; print(sys.prefix)" | Where-Object { $_.Trim() } | Select-Object -Last 1).Trim()
          "OCR_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Install application dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build portable ZIP
        run: python packaging/build_windows.py --ocr-prefix "$env:OCR_PREFIX" --conda-info conda-info.json
      - name: Test on Windows
        shell: pwsh
        run: |
          $env:PATH = "$pwd\packaging\ocr;$env:PATH"
          $env:TESSDATA_PREFIX = "$pwd\packaging\ocr\tessdata"
          $env:PDF2DOCX_TEST_FONT = "$env:WINDIR\Fonts\arial.ttf"
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/smoke_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: PDF2DOCX-Windows-x64
          path: |
            dist/PDF2DOCX-Windows-x64.zip
            dist/PDF2DOCX-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PDF2DOCX-Windows-x64
          path: release
      - name: Publish downloadable preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          if ! gh release view windows-preview >/dev/null 2>&1; then
            gh release create windows-preview --target "$GITHUB_SHA" --prerelease --title 'PDF2DOCX – Windows x64 előzetes' --notes 'Hordozható Windows-csomag. A teljes ZIP-et ki kell bontani, majd a PDF2DOCX.exe indítható. A Windows 10 1607 kompatibilitása még nincs igazolva. A pontos forrásverziót az artifact és a workflow-futás tartalmazza.'
          fi
          gh release upload windows-preview release/* --clobber
